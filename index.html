<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="autor" content="Nikole Ruiz Flores" />
    <meta name="keywords" content="responsive, javascript, travel" />
    <meta name="descrption" content="Lugares de exploracion" />
    <title>Around the U.S</title>
    <link rel="stylesheet" href="./pages/index.css" />
  </head>
  <body>
    <div class="page">
      <header class="header">
        <div class="header__container">
          <img src="./images/around.svg" class="header__title" />
        </div>
      </header>
      <div class="profile">
        <img src="./niko.jpeg" alt="foto de una mujer" class="profile__image" />
        <div class="profile__info">
          <div class="profile__chance">
            <h2 class="profile__name" id="profile__name">Jacques Cousteau</h2>
            <button class="profile__button-edit" id="btn-abrir-popup">
              <img src="./images/Vector.svg" alt="pencil" />
            </button>
          </div>
          <p class="profile__description">Explorador</p>
        </div>
        <button class="profile__button-add" id="btn-abrir-card">+</button>
      </div>

      <div class="overlay" id="overlay">
        <div class="popup" id="popup">
          <h3 class="popup__title">Editar perfil</h3>
          <form class="popup__container" id="registrer">
            <img
              src="./images/Close Icon.svg"
              class="popup__close"
              id="popup__close"
            />
            <div class="contenedor-inputs">
              <input
                type="text"
                name="nombre"
                placeholder="Nombre"
                id="name"
                class="popup__input-name"
              />
              <input
                type="text"
                name="about"
                placeholder="Acerca de mi"
                id="characteristic"
                class="popup__input-about"
              />
            </div>
            <button type="submit" class="btn-submit" value="Guardar">
              Guardar
            </button>
          </form>
        </div>
      </div>

      <!--copy new form//copiar nuevo formulario-->

      <div class="overlay" id="overlay-cards">
        <div class="popup" id="popup-cards">
          <h3 class="popup__title">New Place</h3>
          <form class="popup__container" id="places">
            <img
              src="./images/Close Icon.svg"
              class="popup__close"
              id="cards__close"
            />
            <div class="contenedor-inputs">
              <input
                type="text"
                name="title"
                placeholder="Titulo"
                id="input-card-title"
                class="popup__input"
              />
              <input
                type="text"
                name="link"
                placeholder="Image URL"
                id="input-card-link"
                class="popup__input"
              />
            </div>
            <button type="submit" class="btn-submit" value="Guardar">
              Crear
            </button>
          </form>
        </div>
      </div>

      <!--ventana emergente para la carta-->

      <div class="modal" id="modal-image">
        <div class="modal__container">
          <img
            src="./images/Close Icon.svg"
            class="popup__close"
            id="modal__close"
          />
          <img src="" alt="" class="modal__image-src" />
          <h3 class="modal__image-title"></h3>
        </div>
      </div>

      <!--create letter through template//crear Cards a traves de Template-->

      <div class="card__area" id="card__area"></div>
      <template id="card-template">
        <div class="element">
          <div class="element__container">
            <img
              src="./images/element__trash.png"
              alt="trush"
              class="element__delete-icon"
              id="delete-trash"
            />
            <img
              src="./images/kirill-pershin-1088404-unsplash.jpg"
              alt="foto del valle de yosemite"
              class="photo"
            />
          </div>
          <div class="element__info">
            <h2 class="element__title">Valle de Yosemine</h2>
            <button class="element__like">
              <img src="./images/heart.svg" class="element__heart" />
            </button>
          </div>
        </div>
      </template>

      <p class="footer">&copy 2024 Nikole Ruiz Flores</p>
    </div>
    <script src="app.js"></script>
  </body>
</html>
